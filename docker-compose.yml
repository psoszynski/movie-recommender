services:
  # Shared with ../vector-search-ef — same container name, same credentials, so you can
  # start it from either folder. Databases: VectorDemo (demo) and MovieRec (this project).
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    platform: linux/amd64  # image is x64-only; runs via Rosetta on Apple Silicon
    container_name: vector-demo-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  sqldata:
    # Reuse the volume created by vector-search-ef so both projects share one SQL instance.
    name: vector-search-ef_sqldata
    external: true
